# Development issuer only. Combine with docker-compose.yml.
services:
  gateway:
    profiles: [infra]
    image: doc-insight-gateway:development
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      DI_GATEWAY_HOST: 0.0.0.0
      DI_JWKS_URL: http://127.0.0.1:8000/.well-known/jwks.json
      DI_DEV_JWKS_PATH: /keys/jwks.json
      DI_JWT_ISSUER: ${DI_JWT_ISSUER:-doc-insight-dev}
      DI_JWT_AUDIENCE: ${DI_JWT_AUDIENCE:-doc-insight}
      DI_REDIS_URL: redis://redis:6379/0
      DI_INGEST_URL: ${DI_INGEST_URL:-http://ingest:8001}
      DI_QUERY_URL: ${DI_QUERY_URL:-http://query:8002}
      DI_RATE_LIMIT_RPS: ${DI_RATE_LIMIT_RPS:-5}
      DI_RATE_LIMIT_BURST: ${DI_RATE_LIMIT_BURST:-10}
      DI_RATE_LIMIT_FAIL_OPEN: ${DI_RATE_LIMIT_FAIL_OPEN:-false}
      DI_MAX_UPSTREAM_RESPONSE_BYTES: ${DI_MAX_UPSTREAM_RESPONSE_BYTES:-16777216}
    volumes:
      - ./.dev-keys/jwks.json:/keys/jwks.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
