name: doc-insight-core
services:
  db:
    profiles: [infra]
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-di}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-di}
      POSTGRES_DB: ${POSTGRES_DB:-di}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once on a fresh volume: creates the restricted di_app runtime login.
      - ./deploy/postgres/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.9-alpine
    profiles: [infra]
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [infra]
    entrypoint: [/bin/sh, /scripts/minio-start.sh]
    environment:
      MINIO_ROOT_USER: ${DI_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DI_S3_SECRET_KEY:-minioadmin}
      MINIO_KMS_SECRET_KEY_FILE: /keys/sse-key
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - minio-keys:/keys
      - ./scripts/minio-start.sh:/scripts/minio-start.sh:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [infra]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, /scripts/minio-init.sh]
    environment:
      DI_S3_ACCESS_KEY: ${DI_S3_ACCESS_KEY:-minioadmin}
      DI_S3_SECRET_KEY: ${DI_S3_SECRET_KEY:-minioadmin}
      DI_S3_BUCKET: ${DI_S3_BUCKET:-documents}
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
    restart: "no"
  telemetry-tools:
    image: busybox:1.37.0-musl
    profiles: [telemetry]
    # Replace atomically so restarting this job cannot truncate an active probe.
    command: [sh, -ec, "cp /bin/busybox /health/busybox.tmp && chmod 755 /health/busybox.tmp && mv /health/busybox.tmp /health/busybox"]
    volumes:
      - telemetry-tools:/health
    restart: "no"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [telemetry]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    depends_on:
      telemetry-tools:
        condition: service_completed_successfully
      tempo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
      - "127.0.0.1:${OTEL_PROMETHEUS_PORT:-8889}:8889"
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - telemetry-tools:/health:ro
    healthcheck:
      test: [CMD, /health/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:13133/]
      interval: 5s
      timeout: 3s
      retries: 12
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [telemetry]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  tempo:
    image: grafana/tempo:2.8.1
    profiles: [telemetry]
    command: [-config.file=/etc/tempo.yaml]
    depends_on:
      telemetry-tools:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
      - telemetry-tools:/health:ro
    healthcheck:
      test: [CMD, /health/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      interval: 5s
      timeout: 3s
      retries: 18
  grafana:
    image: grafana/grafana:13.2.1
    profiles: [telemetry]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 18
volumes:
  db-data:
  redis-data:
  minio-data:
  minio-keys:
  telemetry-tools:
  prometheus-data:
  tempo-data:
  grafana-data:
