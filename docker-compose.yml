name: doc-insight-core
x-app-environment: &app-environment
  DI_ENV: ${DI_ENV:-development}
  DI_DATABASE_URL: ${DI_CONTAINER_DATABASE_URL:?Run scripts/configure_local.py or configure deployment credentials}
  DI_REDIS_URL: redis://redis:6379/0
  DI_S3_ENDPOINT: http://minio:9000
  DI_S3_REGION: ${DI_S3_REGION:-us-east-1}
  DI_S3_BUCKET: ${DI_S3_BUCKET:-documents}
  DI_S3_ACCESS_KEY: ${DI_S3_ACCESS_KEY:?Run scripts/configure_local.py or configure deployment credentials}
  DI_S3_SECRET_KEY: ${DI_S3_SECRET_KEY:?Run scripts/configure_local.py or configure deployment credentials}
  DI_S3_USE_SSL: "false"
  DI_OTEL_ENDPOINT: http://otel-collector:4318
  DI_MODEL_CACHE: /home/di/.cache/doc-insight/models
  HF_HUB_OFFLINE: "1"
x-app: &app
  profiles: [app]
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *app-environment
  depends_on: &app-dependencies
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
services:
  gateway:
    <<: *app
    image: ghcr.io/karlo93/doc-insight-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: gateway}
    environment:
      DI_ENV: ${DI_ENV:-development}
      DI_OTEL_ENDPOINT: http://otel-collector:4318
      DI_REDIS_URL: redis://redis:6379/0
      DI_GATEWAY_HOST: 0.0.0.0
      DI_INGEST_URL: http://ingest:8001
      DI_QUERY_URL: http://query:8002
      DI_JWKS_URL: http://127.0.0.1:8000/.well-known/jwks.json
      DI_DEV_JWKS_PATH: /run/dev/jwks.json
      DI_JWT_ISSUER: ${DI_JWT_ISSUER:-doc-insight-dev}
      DI_JWT_AUDIENCE: ${DI_JWT_AUDIENCE:-doc-insight}
      DI_JWKS_CACHE_SECONDS: ${DI_JWKS_CACHE_SECONDS:-300}
      DI_JWKS_REFRESH_SECONDS: ${DI_JWKS_REFRESH_SECONDS:-5}
      DI_TENANTS: ${DI_TENANTS:-demo,other}
      DI_RATE_LIMIT_RPS: ${DI_RATE_LIMIT_RPS:-5}
      DI_RATE_LIMIT_BURST: ${DI_RATE_LIMIT_BURST:-10}
    volumes:
      - dev-jwks:/run/dev:ro
    depends_on:
      <<: *app-dependencies
      dev-issuer:
        condition: service_completed_successfully
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
  dev-issuer:
    # One-shot: private key in its own volume, only the JWKS reaches the gateway.
    profiles: [app]
    image: ghcr.io/karlo93/doc-insight-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: gateway}
    command: [python, /usr/local/lib/dev_issuer.py, ensure]
    restart: "no"
    healthcheck:
      disable: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DI_JWT_ISSUER: ${DI_JWT_ISSUER:-doc-insight-dev}
      DI_JWT_AUDIENCE: ${DI_JWT_AUDIENCE:-doc-insight}
    volumes:
      - dev-issuer:/issuer
      - dev-jwks:/jwks
  ingest:
    <<: *app
    image: ghcr.io/karlo93/doc-insight-ingest:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: ingest}
    environment:
      <<: *app-environment
      DI_HTTP_HOST: 0.0.0.0
  relay:
    <<: *app
    image: ghcr.io/karlo93/doc-insight-ingest:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: ingest}
    # Each tenant is processed in its own transaction under row-level security.
    command: [di-ingest, relay, --tenant, "${DI_TENANTS:-demo,other}"]
    environment:
      <<: *app-environment
      DI_CONTAINER_ROLE: relay
  query:
    <<: *app
    image: ghcr.io/karlo93/doc-insight-query:${QUERY_IMAGE_TAG:-${IMAGE_TAG:-local}}
    build:
      context: .
      args: {APP: query}
    command: [di-query, serve, --host, 0.0.0.0]
    environment:
      DI_ENV: ${DI_ENV:-development}
      DI_OTEL_ENDPOINT: http://otel-collector:4318
      DI_DATABASE_URL: ${DI_CONTAINER_DATABASE_URL:?Configure deployment credentials}
      DI_MODEL_CACHE: /home/di/.cache/doc-insight/models
      HF_HUB_OFFLINE: "1"
      DI_OPENAI_API_KEY: ${DI_OPENAI_API_KEY:-}
      DI_OPENAI_MODEL: ${DI_OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      DI_LLM_DAILY_TOKENS: ${DI_LLM_DAILY_TOKENS:-250000}
      DI_LLM_MAX_OUTPUT_TOKENS: ${DI_LLM_MAX_OUTPUT_TOKENS:-700}
      DI_LLM_CONCURRENCY: ${DI_LLM_CONCURRENCY:-4}
      DI_LLM_TIMEOUT_SECONDS: ${DI_LLM_TIMEOUT_SECONDS:-10}
      DI_LLM_BREAKER_FAILURES: ${DI_LLM_BREAKER_FAILURES:-3}
      DI_LLM_BREAKER_SECONDS: ${DI_LLM_BREAKER_SECONDS:-30}
      DI_ABSTAIN_THRESHOLD: ${DI_ABSTAIN_THRESHOLD:-0.6}
      DI_RRF_K: ${DI_RRF_K:-60}
      DI_QUERY_TOP_K_MAX: ${DI_QUERY_TOP_K_MAX:-20}
  worker:
    <<: *app
    environment:
      <<: *app-environment
      DI_WORKER_HEARTBEAT_SECONDS: ${DI_WORKER_HEARTBEAT_SECONDS:-600}
      DI_WORKER_CLAIM_MIN_IDLE_MS: ${DI_WORKER_CLAIM_MIN_IDLE_MS:-900000}
    image: ghcr.io/karlo93/doc-insight-worker:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: worker}
  migrate:
    <<: *app
    profiles: [app]
    image: ghcr.io/karlo93/doc-insight-worker:${IMAGE_TAG:-local}
    build:
      context: .
      args: {APP: worker}
    command: [alembic, upgrade, head]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      DI_MIGRATION_DATABASE_URL: ${DI_CONTAINER_MIGRATION_DATABASE_URL:?Run scripts/configure_local.py or configure deployment credentials}
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [app]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://localhost/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
  db:
    profiles: [infra]
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-di}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_local.py or configure deployment credentials}
      POSTGRES_DB: ${POSTGRES_DB:-di}
      DI_DB_RUNTIME_PASSWORD: ${DI_DB_RUNTIME_PASSWORD:?Run scripts/configure_local.py or configure deployment credentials}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once on a fresh volume: creates the restricted di_app runtime login.
      - ./deploy/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.9-alpine
    profiles: [infra]
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [infra]
    entrypoint: [/bin/sh, /scripts/minio-start.sh]
    environment:
      MINIO_ROOT_USER: ${DI_S3_ACCESS_KEY:?Run scripts/configure_local.py or configure deployment credentials}
      MINIO_ROOT_PASSWORD: ${DI_S3_SECRET_KEY:?Run scripts/configure_local.py or configure deployment credentials}
      MINIO_KMS_SECRET_KEY_FILE: /keys/sse-key
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - minio-keys:/keys
      - ./scripts/minio-start.sh:/scripts/minio-start.sh:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [infra]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, /scripts/minio-init.sh]
    environment:
      DI_S3_ACCESS_KEY: ${DI_S3_ACCESS_KEY:?Run scripts/configure_local.py or configure deployment credentials}
      DI_S3_SECRET_KEY: ${DI_S3_SECRET_KEY:?Run scripts/configure_local.py or configure deployment credentials}
      DI_S3_BUCKET: ${DI_S3_BUCKET:-documents}
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
    restart: "no"
  telemetry-tools:
    image: busybox:1.37.0-musl
    profiles: [telemetry]
    # Replace atomically so restarting this job cannot truncate an active probe.
    command: [sh, -ec, "cp /bin/busybox /health/busybox.tmp && chmod 755 /health/busybox.tmp && mv /health/busybox.tmp /health/busybox"]
    volumes:
      - telemetry-tools:/health
    restart: "no"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [telemetry]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    depends_on:
      telemetry-tools:
        condition: service_completed_successfully
      tempo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
      - "127.0.0.1:${OTEL_PROMETHEUS_PORT:-8889}:8889"
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - telemetry-tools:/health:ro
    healthcheck:
      test: [CMD, /health/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:13133/]
      interval: 5s
      timeout: 3s
      retries: 12
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [telemetry]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  tempo:
    image: grafana/tempo:2.8.1
    profiles: [telemetry]
    command: [-config.file=/etc/tempo.yaml]
    depends_on:
      telemetry-tools:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
      - telemetry-tools:/health:ro
    healthcheck:
      test: [CMD, /health/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      interval: 5s
      timeout: 3s
      retries: 18
  grafana:
    image: grafana/grafana:13.2.1
    profiles: [telemetry]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/configure_local.py or configure deployment credentials}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 18
volumes:
  caddy-data:
  caddy-config:
  dev-issuer:
  dev-jwks:
  db-data:
  redis-data:
  minio-data:
  minio-keys:
  telemetry-tools:
  prometheus-data:
  tempo-data:
  grafana-data:
