[project]
name = "doc-insight-testing"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "doc-insight-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_insight"]

[tool.uv.sources]
doc-insight-contracts = { workspace = true }
