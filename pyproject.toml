[project]
name = "doc-insight"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.14",
    "pip-audit>=2.9",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
include_namespace_packages = true

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[tool.bandit]
exclude_dirs = ["tests", "*/tests/*"]
