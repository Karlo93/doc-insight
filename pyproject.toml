[project]
name = "doc-insight"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "fonttools>=4.64.0",
    "fpdf2>=2.8.8",
    "mypy>=1.14",
    "pip-audit>=2.9",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
addopts = '--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -m "not models and not integration"'
markers = ["models: requires runtime model downloads", "integration: requires Postgres"]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
include_namespace_packages = true

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["apps/worker/src", "packages/contracts/src", "packages/testing/src", "packages/observability/src"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "*/tests/*"]
