name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make setup
      - run: make lint
      - run: make typecheck
      - name: compose
        run: |
          python scripts/configure_local.py
          docker compose --profile '*' config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.private.yml --profile '*' config --quiet
      - name: Browser modules
        run: |
          for file in frontend/*.js frontend/*.mjs; do node --check "$file"; done
          node --test tests/frontend/*.test.mjs
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: di-ci
      DI_MIGRATION_DATABASE_URL: postgresql+psycopg://di:di@127.0.0.1:5432/di
      DI_REDIS_URL: redis://127.0.0.1:6379/0
      DI_S3_ENDPOINT: http://127.0.0.1:9000
      DI_S3_REGION: us-east-1
      DI_S3_BUCKET: documents
      DI_S3_ACCESS_KEY: minioadmin
      DI_S3_SECRET_KEY: minioadmin
      DI_S3_USE_SSL: "false"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: di
          POSTGRES_PASSWORD: di
          POSTGRES_DB: di
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U di -d di"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.9-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Actions services cannot supply MinIO's required server command.
      - name: MinIO service
        run: |
          python scripts/configure_local.py
          docker compose up -d --wait --wait-timeout 60 minio
          docker compose run --rm minio-init
      - run: make setup
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hrv
      - run: make test
      - run: make test-integration
      - name: MinIO cleanup
        if: always()
        run: docker compose down minio-init minio
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make setup
      - run: make audit
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Karlo93/doc-insight'
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, ingest, query, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/karlo93/doc-insight-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/karlo93/doc-insight-${{ matrix.app }}:main
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}
          sbom: true
          provenance: mode=max
