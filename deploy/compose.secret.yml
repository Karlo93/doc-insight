# Optional provider secret: export OPENAI_SECRET_FILE to an absolute, untracked file.
services:
  query:
    environment:
      DI_OPENAI_API_KEY: ""
      DI_OPENAI_API_KEY_FILE: /run/secrets/openai_key
    secrets: [openai_key]
secrets:
  openai_key:
    file: ${OPENAI_SECRET_FILE:?Set OPENAI_SECRET_FILE to your local key file}
