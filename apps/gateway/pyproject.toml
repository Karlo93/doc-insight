[project]
name = "doc-insight-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50,<51",
    "doc-insight-contracts",
    "doc-insight-observability",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.13,<3",
    "redis>=6.4,<7",
    "uvicorn>=0.35,<1",
]

[project.scripts]
di-gateway = "doc_insight.gateway.cli:main"

[tool.uv.sources]
doc-insight-contracts = { workspace = true }
doc-insight-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_insight"]
