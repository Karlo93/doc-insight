[project]
name = "doc-insight-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "doc-insight-contracts",
    "en-core-web-sm",
    "fastembed>=0.8.0",
    "hr-core-news-sm",
    "huggingface-hub>=1.30.0",
    "lingua-language-detector>=2.2.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "spacy>=3.8,<3.9",
    "tokenizers>=0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_insight"]

[project.scripts]
di = "doc_insight.worker.cli:main"

[tool.uv.sources]
doc-insight-contracts = { workspace = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
hr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/hr_core_news_sm-3.8.0/hr_core_news_sm-3.8.0-py3-none-any.whl" }
